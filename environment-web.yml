name: cytoflowweb
channels:
  - defaults
  - cytoflow
  - conda-forge

dependencies:
  # ── Python ────────────────────────────────────────────────────────────────
  - python=3.12

  # ── Scientific core (mirrors environment.yml) ─────────────────────────────
  - numpy=2.2
  - pandas=2.3
  - matplotlib=3.10        # kept for existing IView.plot() / Jupyter compat
  - bottleneck=1.4
  - numexpr=2.11
  - scipy=1.16
  - scikit-learn=1.7
  - seaborn=0.13.2
  - statsmodels=0.14
  - natsort=8.4
  - numba=0.61
  - opentsne=1.0.4
  - igraph=0.10
  - python-igraph=0.11
  - scikit-fda=0.10
  - gmpy2==2.1.5            # 2.2.1 crashes
  - defaults::libffi

  # ── Traits / serialization (needed by cytoflow core & .flow files) ────────
  - traits=7.0
  - traitsui=8.0            # used only for .flow YAML deserialization
  - pyface=8.0              # transitive dep of traitsui
  - envisage=7.0            # transitive dep of cytoflowgui serialization
  - cytoflow::camel=0.1.2   # .flow YAML format
  - nbformat=5.10           # Jupyter notebook export
  - python-dateutil=2.9
  - importlib_resources=6.4
  - configobj=5.0
  - yapf=0.40               # notebook export code formatting
  - setuptools=80
  - swig                    # Logicle C++ extension build

  # ── Web back end ──────────────────────────────────────────────────────────
  - pip:
    - fastapi>=0.115
    - uvicorn[standard]>=0.30
    - python-multipart>=0.0.9   # fastapi file upload support
    - httpx>=0.27               # async HTTP client for internal calls
    - starlette>=0.41           # WSGIMiddleware (ships with fastapi)

  # ── Dash front end ────────────────────────────────────────────────────────
  - pip:
    - dash>=2.17
    - dash-bootstrap-components>=1.6
    - dash-extensions>=1.0
    - plotly>=5.22
